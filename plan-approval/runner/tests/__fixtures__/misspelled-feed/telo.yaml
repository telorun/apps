kind: Telo.Application
metadata:
  name: MisspelledFeedField
  version: 1.0.0
  description: |
    The runner's feed call, as the runner declares it, and a reader that
    misspells a field of its page.
imports:
  RunnerProtocol: ../../../../runner-protocol
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  HttpClient: oci://ghcr.io/telorun/http-client@0.23.0#sha256-6WAIh0ajnTlkWNuP-59e1qNVUXVSJDWZxvPVACQg1AM
targets:
  - !ref cycle
---
kind: Run.Sequence
metadata: { name: cycle }
steps:
  - name: pending
    invoke:
      kind: Run.Sequence
      inputType:
        kind: Telo.JsonSchema
        schema:
          type: object
          required: [after]
          properties:
            after: { type: integer }
      outputType: !ref RunnerProtocol.CommandPage
      steps:
        - name: get
          invoke: { kind: HttpClient.Request }
          inputs:
            url: http://127.0.0.1:18767/api/agent/runners/r1/commands
            query: { after: !cel "string(inputs.after)" }
      outputs:
        commands: !cel "steps.get.result.body.commands"
        cursor: !cel "steps.get.result.body.cursor"
    inputs: { after: 0 }
  - name: next
    value: !cel "steps.pending.result.cusor"
