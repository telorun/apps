kind: Telo.Application
metadata:
  name: RunnerWithSharedDirectory
  version: 1.0.0
  description: |
    Boots the runner with two repository slugs mapped to one directory and
    fails once it has exited, so the runner's own refusal is on this run's
    stderr.
imports:
  App: oci://ghcr.io/telorun/app@0.3.0#sha256-LuwPnxFKjpaQ4Y11mIEDbTzMz41dg-degJPFhl6kdmc
  Run: oci://ghcr.io/telorun/run@0.28.0#sha256-CoPkA-u8-m4kjQAOTDr_TmsfA72HDpnoZI-hHz8N7kE
  Timer: oci://ghcr.io/telorun/timer@0.9.0#sha256-Phjx5KkREnLAB68DlKZUx5bRkDosEO3WaMVMUS2-pfg
targets:
  - !ref runner
  - !ref awaitExit
---
kind: App.Instance
metadata: { name: runner }
source: ../../../telo.yaml
awaitStart: false
variables:
  serverUrl: http://127.0.0.1:18769
  runnerName: r1
  repos:
    alpha: !module-path ./repo
    beta: !module-path ./repo
  permissionMode: plan
---
kind: Run.Sequence
metadata: { name: awaitExit }
steps:
  - name: wait
    invoke:
      kind: Run.Loop
      condition: !cel "resources.runner.status.exitCode == null"
      maxIterations: 200
      steps:
        - name: pause
          invoke: { kind: Timer.Delay }
          inputs: { duration: 50ms }
  - name: exited
    throw:
      code: ERR_RUNNER_EXITED
      message: !cel "'The runner exited with ' + string(resources.runner.status.exitCode) + '.'"
