# The release anchor. Its LOCATION is what every module key, ledger entry and
# fragment path is relative to, and where the shared `.telo` cache lives.
release:
  registry: oci://ghcr.io/telorun/solutions
  modules:
    # One entry per domain. A member's ref is its domain's base plus its own
    # directory name: `oci://ghcr.io/telorun/solutions/plan-approval/server`.
    # Anchored one level below the domain: a looser glob would also claim every
    # test fixture that carries a `metadata.version`.
    - path: /plan-approval/*
      registry: oci://ghcr.io/telorun/solutions/plan-approval
