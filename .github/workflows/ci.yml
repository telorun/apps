name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check & manifest tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The published CLI, deliberately: a module is run or imported by whoever
      # obtains it, on a released telo, so that is what it is checked and tested
      # against.
      - name: Install telo CLI
        run: npm install -g @telorun/cli

      # Every application and library of every domain.
      - name: Static check
        run: |
          shopt -s nullglob
          manifests=(*/*/telo.yaml)
          telo check "${manifests[@]}"

      # Each member carries its own suite. One failing does not stop the others, so
      # a run shows the state of every one.
      - name: Manifest tests
        run: |
          shopt -s nullglob
          failed=0
          for suite in */*/test-suite.yaml; do
            echo "::group::$suite"
            telo "./$suite" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install telo CLI
        run: npm install -g @telorun/cli

      # Fails when no consistent release plan can be formed: a fragment naming an
      # unknown module, a major-inducing kind (modules are pre-1.0), a manifest version
      # disagreeing with its ledger entry, two modules resolving to one ref, or a
      # relative import that canonicalizes to a ref nothing publishes. It does NOT
      # fail merely because a payload moved — that ships as an unattributed patch.
      # It warns when a module's own files changed and no fragment names it.
      - name: Release plan is consistent
        run: telo release check
